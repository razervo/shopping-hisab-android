name: Build Shopping Hisab Handwriting Scanner
on:
  workflow_dispatch:
  push:
    paths:
      - 'scanner-prototype/**'
      - '.github/workflows/build-scanner-prototype.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: shopping-hisab-ppocr-scanner
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch pinned PaddleOCR SDK and verify model files
        working-directory: scanner-prototype
        run: bash scripts/prepare-ppocr.sh
      - name: Build debug APK
        working-directory: scanner-prototype
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shopping-hisab-ppocrv5-scanner-debug
          path: scanner-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
