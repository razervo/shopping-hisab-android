name: Deploy Shopping Hisab native Worker

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-native-migration

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-source
    steps:
      - name: Check out native migration branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-native-migration
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build native Cloudflare app
        run: npm run build:native
      - name: Verify isolated deployment target
        run: |
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('wrangler.native.jsonc','utf8')); if(c.name!=='shopping-hisab-native') process.exit(1)"
      - name: Rotate exposed pre-launch auth secret
        run: openssl rand -hex 48 | npx wrangler secret put BETTER_AUTH_SECRET --config wrangler.native.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5ab302219d43e0312e9d6fce7863c58f
      - name: Verify Vite-generated isolated Worker bundle
        run: |
          node -e "const fs=require('fs'); const p='.wrangler/deploy/config.json'; if(!fs.existsSync(p)) throw new Error('Vite-generated Wrangler deployment config is missing'); const c=JSON.parse(fs.readFileSync(p,'utf8')); if(c.name!=='shopping-hisab-native') throw new Error('Refusing deployment: generated Worker name is not shopping-hisab-native'); if(!c.main) throw new Error('Generated Worker entry point is missing'); console.log('Verified generated Worker:', c.name, 'entry:', c.main)"
      - name: Deploy only the native Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5ab302219d43e0312e9d6fce7863c58f
