name: Export Shopping Hisab source ZIP

on:
  push:
    branches: [main]
    paths:
      - "app-source/**"
      - ".github/workflows/export-source.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package project source
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cd app-source
          zip -qr ../artifacts/Shopping-Hisab-source.zip .

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: shopping-hisab-source
          path: artifacts/Shopping-Hisab-source.zip
          if-no-files-found: error
          retention-days: 30
