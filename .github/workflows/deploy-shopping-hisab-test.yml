name: Deploy Shopping Hisab test Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopping-hisab-test-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-source
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: shopping-hisab-test-deploy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build test Worker
        run: npm run build:native

      - name: Apply migrations to isolated test D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5ab302219d43e0312e9d6fce7863c58f
        run: npx wrangler d1 migrations apply shopping-hisab-test --remote --config wrangler.test.jsonc

      - name: Deploy isolated test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5ab302219d43e0312e9d6fce7863c58f
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Ensure persistent auth secret exists on test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5ab302219d43e0312e9d6fce7863c58f
        run: |
          if ! npx wrangler secret list --config dist/server/wrangler.json | grep -q 'BETTER_AUTH_SECRET'; then
            openssl rand -base64 48 | npx wrangler secret put BETTER_AUTH_SECRET --config dist/server/wrangler.json
          else
            echo "Persistent test auth secret already exists; leaving it unchanged."
          fi
