name: Build and deploy Shopping Hisab native Worker

on:
  workflow_dispatch:
  push:
    branches: [cloudflare-native-migration]
    paths:
      - .github/workflows/deploy-native-preview.yml

permissions:
  contents: read

concurrency:
  group: shopping-hisab-native-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'APPROVED DEPLOY SHOPPING HISAB FK FIX'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-source
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build native app
        run: npm run build:native

      - name: Deploy isolated native Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5ab302219d43e0312e9d6fce7863c58f
        run: npx wrangler deploy --config dist/server/wrangler.json
