name: Build and deploy Shopping Hisab native Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopping-hisab-native-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-source
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build native app
        run: npm run build:native

      - name: Refuse production-targeted preview deployment
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("dist/server/wrangler.json","utf8")); const dbs=c.d1_databases||[]; const prodDb="4392cac4-98c2-46b1-9a54-de811873c5a8"; if(c.name!=="shopping-hisab-preview") throw new Error("Preview deploy blocked: Worker name is not shopping-hisab-preview"); if(!dbs.length||dbs.some(x=>!x.database_id||x.database_id===prodDb)) throw new Error("Preview deploy blocked: D1 database is missing or points to production"); console.log("Preview Worker and D1 target verified as isolated");'
      - name: Deploy isolated native Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5ab302219d43e0312e9d6fce7863c58f
        run: npx wrangler deploy --config dist/server/wrangler.json
