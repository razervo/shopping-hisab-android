name: Build and deploy Shopping Hisab native Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopping-hisab-native-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-source
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply preview-only database migrations
        run: npx wrangler d1 migrations apply shopping-hisab-preview --remote --config wrangler.preview.jsonc

      - name: Build native app using isolated preview config
        env:
          CF_WRANGLER_CONFIG: wrangler.preview.jsonc
        run: npm run build:native

      - name: Refuse production-targeted preview deployment
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("dist/server/wrangler.json","utf8")); const dbs=c.d1_databases||[]; const prodDb="4392cac4-98c2-46b1-9a54-de811873c5a8"; const previewDb="2f5e0a14-59c9-40d8-8d17-e2f5856934d6"; if(c.name!=="shopping-hisab-preview") throw new Error("Preview deploy blocked: Worker name is not shopping-hisab-preview"); if(dbs.length!==1||dbs[0].database_id!==previewDb||dbs.some(x=>!x.database_id||x.database_id===prodDb)) throw new Error("Preview deploy blocked: D1 must be the dedicated preview database"); if(c.vars?.APP_BASE_URL!=="https://shopping-hisab-preview.hasimabd13.workers.dev") throw new Error("Preview deploy blocked: preview base URL mismatch"); console.log("Preview Worker, URL, and D1 target verified as isolated");'
      - name: Deploy isolated native Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5ab302219d43e0312e9d6fce7863c58f
        run: npx wrangler deploy --config dist/server/wrangler.json
