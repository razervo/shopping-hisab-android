name: Phase 2 checks

on:
  pull_request:
  push:
    branches:
      - phase2-complete-feature-work

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: app-source
        run: npm install
      - name: Run Phase 3 integrity regression checks
        working-directory: app-source
        run: python scripts/test-bill-deletion.py
      - name: Run Phase 3 reconciliation and retry-recovery audit
        working-directory: app-source
        run: |
          python3 scripts/test-reconciliation-integrity.py
          python3 scripts/test-drive-recovery.py
          node scripts/test-bill-line-idempotency.mjs
          node scripts/test-bill-create-idempotency.mjs
          node scripts/test-ui-mutation-retry-recovery.mjs
          node scripts/test-estimate-line-integrity.mjs
          node scripts/test-estimate-idempotency.mjs
      - name: Run Phase 2 regression tests
        working-directory: app-source
        run: npm run test:shopping-categories
      - name: Run calendar date validation regression tests
        working-directory: app-source
        run: npm run test:date-validation
      - name: Run HTML escaping security regression tests
        working-directory: app-source
        run: npm run test:html-escape
      - name: Run profile privacy allow-list tests
        working-directory: app-source
        run: npm run test:public-profile
      - name: Lint
        working-directory: app-source
        run: npm run lint
      - name: Build application (no deployment)
        working-directory: app-source
        run: npm run build
