name: Verify Shopping Hisab Cloudflare build

on:
  push:
    branches: [main, cloudflare-native-migration]
    paths:
      - "app-source/**"
      - ".github/workflows/cloudflare-build.yml"
  pull_request:
    paths:
      - "app-source/**"
      - ".github/workflows/cloudflare-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-source
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build for Cloudflare Workers
        run: |
          if [ "$GITHUB_REF_NAME" = "cloudflare-native-migration" ]; then
            npm run build:native
          else
            npm run build
          fi
      - name: Verify Android TWA files are included
        run: |
          test -s dist/client/.well-known/assetlinks.json
          test -s dist/client/manifest.json
          test -s dist/client/manifest.webmanifest
      - name: Bundle and validate isolated native Worker (no deployment)
        if: github.ref_name == 'cloudflare-native-migration'
        run: |
          rm -rf .native-worker-bundle
          npx wrangler deploy --dry-run
          test -s .wrangler/deploy/config.json
          echo "Generated deployment config:"
          cat .wrangler/deploy/config.json
          test -n "$(find dist -type f -size +0c -print -quit)"
          echo "Generated Worker and client files:"
          find dist .wrangler/deploy -maxdepth 3 -type f -size +0c -printf '%p (%s bytes)\n' | sort
      - name: Upload native Worker bundle
        if: github.ref_name == 'cloudflare-native-migration'
        uses: actions/upload-artifact@v4
        with:
          name: shopping-hisab-native-worker
          path: |
            app-source/dist/**
            app-source/.wrangler/deploy/**
          if-no-files-found: error
          retention-days: 7
