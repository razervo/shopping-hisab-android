plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.shoppinghisab.scannerprototype'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shoppinghisab.scannerprototype'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'

        // Keep this test APK focused on modern ARM phones; avoids bundling
        // large x86 and 32-bit native ONNX/OpenCV libraries.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.21.1'
    implementation 'com.quickbirdstudios:opencv:4.5.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
